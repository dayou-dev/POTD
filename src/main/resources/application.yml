spring:
  application:
    name: potd

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/potd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true&allowLoadLocalInfile=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true